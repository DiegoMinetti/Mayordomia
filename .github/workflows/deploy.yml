name: Deploy GitHub Pages + publish container images
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
  packages: write    # required for ghcr.io push
concurrency:
  group: pages
  cancel-in-progress: true
env:
  REGISTRY: ghcr.io
  # ghcr.io tag rules require lowercase. Hardcode the lowercase owner to
  # avoid relying on GitHub's expression functions, which have changed
  # behaviour across runner versions.
  IMAGE_OWNER: diegominetti
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}
          VITE_APPS_SCRIPT_URL: ${{ secrets.VITE_APPS_SCRIPT_URL }}
          VITE_BASE_PATH: ${{ vars.VITE_BASE_PATH || '/' }}

      # ── GitHub Pages deploy (legacy path, kept for fallback) ────────────
      - uses: actions/configure-pages@v5
        with:
          # Auto-enable Pages on first run. Without this the step fails
          # with "Get Pages site failed … Not Found" because the repo
          # hasn't been configured for Pages yet.
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with: { path: dist }

      # ── Container images for the Raspberry Pi ───────────────────────────
      # Build single-arch (arm64) because the only consumer is the Pi.
      # QEMU user-mode emulation in the GitHub runner trips an illegal-
      # instruction in Node 20 on arm64 (known issue, alpine + node 20).
      # If you ever need amd64, add a self-hosted arm64 runner or a
      # separate amd64 build step.
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v5
        with:
          context: ./gateway
          push: true
          platforms: linux/arm64
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/mayordomia-api:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/mayordomia-api:${{ github.sha }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      - uses: docker/build-push-action@v5
        with:
          context: .
          file: ./web-image/Dockerfile
          push: true
          platforms: linux/arm64
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/mayordomia-web:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/mayordomia-web:${{ github.sha }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

