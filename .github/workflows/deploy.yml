name: Deploy GitHub Pages + publish container images
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
  packages: write    # required for ghcr.io push
concurrency:
  group: pages
  cancel-in-progress: true
env:
  REGISTRY: ghcr.io
  IMAGE_OWNER: ${{ github.repository_owner }}
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}
          VITE_APPS_SCRIPT_URL: ${{ secrets.VITE_APPS_SCRIPT_URL }}
          VITE_BASE_PATH: ${{ vars.VITE_BASE_PATH || '/' }}

      # ── GitHub Pages deploy (legacy path, kept for fallback) ────────────
      - uses: actions/configure-pages@v5
        with:
          # Auto-enable Pages on first run. Without this the step fails
          # with "Get Pages site failed … Not Found" because the repo
          # hasn't been configured for Pages yet.
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with: { path: dist }

      # ── Container images for the Raspberry Pi ───────────────────────────
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # API image (Node gateway). Same Dockerfile the Pi builds locally,
      # but tagged with the commit SHA + `latest` for `docker compose pull`.
      - uses: docker/build-push-action@v5
        with:
          context: ./gateway
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/mayordomia-api:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/mayordomia-api:${{ github.sha }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      # Web image (nginx + dist/). Context is repo root because the
      # Dockerfile expects to COPY the freshly built `dist/` directory.
      - uses: docker/build-push-action@v5
        with:
          context: .
          file: ./web-image/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/mayordomia-web:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/mayordomia-web:${{ github.sha }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

