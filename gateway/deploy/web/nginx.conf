server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Health probe pasivo: el healthcheck real vive en /ping del servicio api.
    location = /api/health {
        proxy_pass http://mayordomia-api:3000/ping;
        proxy_set_header Host $host;
    }

    # API: todo lo que llega a /api/* se proxea al gateway Node.
    location /api/ {
        proxy_pass http://mayordomia-api:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Por si en el futuro agregás uploads:
        client_max_body_size 10m;
    }

    # SPA: vite-plugin-pwa genera un 404.html que hace sessionStorage redirect.
    location / {
        try_files $uri $uri/ $uri.html /index.html;
    }

    # Long cache para assets con hash.
    location ~* \.(js|css|svg|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
