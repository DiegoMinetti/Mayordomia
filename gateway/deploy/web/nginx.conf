server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Cloudflared talks HTTP to nginx inside the Docker network, so nginx's
    # $scheme is "http" even though the public scheme is HTTPS. Without this,
    # nginx's auto-trailing-slash redirect for `POST /api` (which fires because
    # VITE_APPS_SCRIPT_URL=/api hits `location /api/` without a trailing slash)
    # would be `Location: http://mayordomia.fewlines.com.ar/api/` — triggering
    # the browser's mixed-content blocker. `absolute_redirect off` makes nginx
    # return relative paths in 3xx redirects, and the browser keeps the
    # original (HTTPS) scheme when following them.
    absolute_redirect off;

    # Exact-match for the single-action dispatcher (`POST /api`). BootstrapClient
    # uses appsScriptUrl='/api' and posts here with action+payload. Without this
    # block, `/api` falls through to `location /api/` which would strip the
    # prefix and forward `/` to the gateway (404). Forwarding as `/api` keeps
    # the gateway's `app.post('/api', ...)` route reachable.
    location = /api {
        proxy_pass http://mayordomia-api:3000/api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /api/health {
        proxy_pass http://mayordomia-api:3000/ping;
        proxy_set_header Host $host;
    }

    location /api/ {
        # Trailing slash on proxy_pass → nginx STRIPS the /api/ prefix and
        # forwards /auth/register, /health, etc. Without it, nginx passes the
        # full /api/auth/register path to the gateway which 404s.
        proxy_pass http://mayordomia-api:3000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 10m;
    }

    # vite-plugin-pwa generates 404.html that stashes the deep link in
    # sessionStorage and bounces to the SPA root. Same trick as on GH Pages.
    location / {
        try_files $uri $uri/ $uri.html /index.html;
    }

    location ~* \.(js|css|svg|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
