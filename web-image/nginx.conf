server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location = /api/health {
        proxy_pass http://mayordomia-api:3000/ping;
        proxy_set_header Host $host;
    }

    location /api/ {
        proxy_pass http://mayordomia-api:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 10m;
    }

    # vite-plugin-pwa generates 404.html that stashes the deep link in
    # sessionStorage and bounces to the SPA root. Same trick as on GH Pages.
    location / {
        try_files $uri $uri/ $uri.html /index.html;
    }

    location ~* \.(js|css|svg|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
